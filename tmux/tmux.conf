# --- Terminal ---
set-option -g default-terminal "tmux-256color"
# true colour for the outer terminal (Ghostty reports xterm-256color)
set -sa terminal-features ",xterm*:RGB"
# nvim reloads files changed elsewhere when its pane gets focus
set -g focus-events on
# short Esc delay: otherwise Esc in nvim feels laggy inside tmux
set -sg escape-time 10
# images from nvim (inkmath) reach the terminal through tmux
set -g allow-passthrough on

# --- Prefix and basics ---
set -g mouse on

unbind %
unbind p

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# <prefix> r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Splits, windows and panes ---
bind t split-window -h -c "#{pane_current_path}"
bind g split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# <prefix> d asks first: zsh starts tmux with exec, so a detach closes the terminal window
bind d confirm-before -p "Detach? Closes this terminal window, sessions keep running (y/n)" detach-client

# <prefix> x: inside the scratch popup close and end it, otherwise close the pane (no confirm)
bind x if-shell -F '#{==:#{session_name},scratch}' {
  kill-session
} {
  kill-pane
}

# Vim style pane selection. In nvim the key becomes Ctrl h/j/k/l (vim-tmux-navigator),
# so nvim moves between its own splits first and tmux takes over at the edge.
bind h if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-h' 'select-pane -L'
bind j if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-j' 'select-pane -D'
bind k if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-k' 'select-pane -U'
bind l if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-l' 'select-pane -R'

# Vim-style pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# <prefix> < / >: resize the nvim split when the pane runs nvim, otherwise the tmux pane
bind -r < if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys C-w '<'" 'resize-pane -L 5'
bind -r > if-shell -F '#{==:#{pane_current_command},nvim}' "send-keys C-w '>'" 'resize-pane -R 5'

# --- Moving panes between windows ---
# <prefix> s: break pane into its own window
bind-key s command-prompt -p "break pane to:" "break-pane -t '%%'"
# <prefix> S: send the current pane to another window (enter its number)
bind-key S command-prompt -p "send pane to window:" "join-pane -h -t ':%%'"
# <prefix> B: bring the active pane of another window into this one
bind-key B command-prompt -p "bring pane from window:" "join-pane -h -s ':%%'"
# (also: <prefix> m marks a pane, then ":join-pane" in the target window pulls it in)

# --- Pane borders ---
# All grey. When a window is split, every pane gets a title bar
# ("1 nvim · configs"); the active pane's title is highlighted blue.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#3b4261'
set -g pane-border-format "#{?pane_active,#[fg=#1f2335#,bg=#7aa2f7#,bold],#[fg=#565f89]} #P #{pane_current_command} · #{b:pane_current_path} #[default]"
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# --- Copy mode: vim keys, everything ends up in the macOS clipboard ---
# <prefix> v enters it ([ is awkward on a German layout), q leaves.
# Copy mode always works on one pane, so selections never run into the pane next to it.
setw -g mode-keys vi
set -s copy-command 'pbcopy' # used by every copy below, incl. mouse select and double/triple click
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
# Mouse: drag selects inside the pane under the cursor and copies on release.
# (tmux's defaults already do this; copy-command above makes it reach the clipboard)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Popups ---
# <prefix> f: project switcher (sesh + fzf), <prefix> F: add current folder as a project,
# <prefix> G: lazygit, <prefix> p: scratch shell
bind f display-popup -E -w 60% -h 60% -b rounded -T ' projects ' "~/.config/tmux/scripts/project-picker.sh"
bind F run-shell "~/.config/tmux/scripts/project-add.sh '#{pane_current_path}'"

# <prefix> D: dev boxes on the home server, each box a window in the "boxes" session.
# The script checks for ~/bin/dev and the server first (see the script).
bind D run-shell -b "~/.config/tmux/scripts/dev-boxes.sh '#{client_name}'"
bind G display-popup -E -w 90% -h 90% -b rounded -d "#{pane_current_path}" lazygit

# <prefix> p: toggle the scratch popup (its own "scratch" session, so its content survives hiding
# and prefix keys work inside it). <prefix> x inside it ends the session.
# detach-on-destroy on (only for scratch) makes kill-session close the popup instead of switching.
bind p if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -E -w 80% -h 70% -b rounded -T ' scratch ' -d "#{pane_current_path}" "tmux new-session -A -s scratch \\; set-option detach-on-destroy on \\; set-option status off"
}

# --- Numbering and sessions ---
# windows and panes start at 1, not 0
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Closing the last window of a session (e.g. the last box) switches to another session instead
# of detaching; zsh runs tmux with exec, so a detach closes the terminal window
set -g detach-on-destroy off

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# <prefix> Space: pick any hash / URL / path / ARN on screen with fzf, enter copies it, tab types it
set -g @extrakto_key 'Space'
set -g @extrakto_popup_size '70%,50%'

# auto-save sessions every 15 min, restore on tmux start
set -g @continuum-restore 'on'
# panes that ran nvim start `nvim` again; persistence.nvim then reopens that folder's files
set -g @resurrect-processes 'lazygit'

# --- Quiet: no bells or activity alerts ---
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Status bar (tokyonight storm, like nvim and Ghostty) ---
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-justify centre
set -g status-interval 15 # the clock only shows minutes; also refreshes the git info

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#1f2335,bg=#7aa2f7,bold] #S #[bg=#1f2335] "

# Right: repo:branch of the active pane, date, time, host
set -g status-right-length 100
set -g status-right "#[fg=#9ece6a]#(~/.config/tmux/scripts/git-repo.sh '#{pane_current_path}')#[fg=#565f89]| #[fg=#7aa2f7]%d-%m-%Y %H:%M #[fg=#565f89]| #[fg=#bb9af7]#h "

# Windows in the middle; the active one orange, windows with a bell/activity red
setw -g window-status-format " #I:#W "
setw -g window-status-style 'fg=#565f89'
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-style 'fg=#ff9e64,bold'

# copy mode / popups / messages in the same colours
setw -g mode-style 'bg=#364a82,fg=#c0caf5'
set -g message-style 'bg=#1f2335,fg=#7aa2f7'
set -g popup-style 'bg=#24283b,fg=#c0caf5'
set -g popup-border-style 'fg=#ff9e64'

# --- Plugin bootstrap (keep last) ---
# Fresh machine: fetch TPM, load it, then install the plugins above and reload.
# install_plugins needs the plugin path that tpm sets, so it has to run after it.
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
if "test ! -d ~/.config/tmux/plugins/tmux-sensible" \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins && tmux source-file ~/.config/tmux/tmux.conf'"
