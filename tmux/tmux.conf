# Enables full color support
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Enables mouse interaction
set -g mouse on

unbind %
unbind p

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind t split-window -h -c "#{pane_current_path}"
bind g split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# <prefix> x close pane (no confirm)
bind x kill-pane

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## Break pane into its own window: <prefix> s
#bind-key j command-prompt -p "join pane from:"  "join-pane -s -v'%%'"
bind-key s command-prompt -p "break pane to:" "break-pane -t '%%'"

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# Start windows and panes at 1, not 0
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto-save sessions every 15 min, restore on tmux start
set -g @continuum-restore 'on'

# <prefix> r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Status bar colors
set -g status-style bg=colour235,fg=colour136

# Left side: session name
set -g status-left-length 40
set -g status-left "#[fg=colour148,bold]#S #[fg=colour245]| "

# Right side: date, time, and hostname
set -g status-right-length 100
set -g status-right "#[fg=colour39]%d-%m-%Y #[fg=colour39]%H:%M #[fg=colour39]#H"

# Center the window list
set -g status-justify centre

# Update the status bar every second (for clock)
set -g status-interval 1

# Active window styling in status bar
setw -g window-status-current-style fg=colour39,bold
setw -g window-status-current-format " #I:#W "

# Inactive window styling
setw -g window-status-style fg=colour245
setw -g window-status-format " #I:#W "
set -g status-right-style "fg=colour39,bg=colour235"

# Fresh machine: fetch TPM, load it, then install the plugins above and reload.
# install_plugins needs the plugin path that tpm sets, so it has to run after it.
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
if "test ! -d ~/.config/tmux/plugins/tmux-sensible" \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins && tmux source-file ~/.config/tmux/tmux.conf'"

