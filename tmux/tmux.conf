# Enables full color support
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Enables mouse interaction
set -g mouse on

unbind %
unbind p

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind t split-window -h -c "#{pane_current_path}"
bind g split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# <prefix> d asks first: zsh starts tmux with exec, so a detach closes the Alacritty window
bind d confirm-before -p "Detach? Closes this Alacritty window, sessions keep running (y/n)" detach-client

# <prefix> x close pane (no confirm)
bind x kill-pane

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## Break pane into its own window: <prefix> s
#bind-key j command-prompt -p "join pane from:"  "join-pane -s -v'%%'"
bind-key s command-prompt -p "break pane to:" "break-pane -t '%%'"

# Pane borders: all grey. When a window is split, every pane gets a title bar
# ("1 nvim · configs"); the active pane's title is highlighted blue.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#3b4261'
set -g pane-border-format "#{?pane_active,#[fg=#1f2335#,bg=#7aa2f7#,bold],#[fg=#565f89]} #P #{pane_current_command} · #{b:pane_current_path} #[default]"
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# --- Copy mode: vim keys, everything ends up in the macOS clipboard ---
# <prefix> v enters it ([ is awkward on a German layout), q leaves.
# Copy mode always works on one pane, so selections never run into the pane next to it.
setw -g mode-keys vi
set -s copy-command 'pbcopy' # used by every copy below, incl. mouse select and double/triple click
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
# Mouse: drag selects inside the pane under the cursor and copies on release.
# (tmux's defaults already do this; copy-command above makes it reach the clipboard)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Popups ---
# <prefix> f: project switcher (sesh + fzf), <prefix> F: add current folder as a project,
# <prefix> G: lazygit, <prefix> p: scratch shell
bind f display-popup -E -w 60% -h 60% -b rounded -T ' projects ' "~/.config/tmux/scripts/project-picker.sh"
bind F run-shell "~/.config/tmux/scripts/project-add.sh '#{pane_current_path}'"

# <prefix> D: dev boxes on the home server, each box a window in the "boxes" session.
# The script checks for ~/bin/dev and the server first (see the script).
bind D run-shell -b "~/.config/tmux/scripts/dev-boxes.sh '#{client_name}'"
bind G display-popup -E -w 90% -h 90% -b rounded -d "#{pane_current_path}" lazygit
bind p display-popup -E -w 80% -h 70% -b rounded -T ' scratch ' -d "#{pane_current_path}"

# Start windows and panes at 1, not 0
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Closing the last window of a session (e.g. the last box) switches to another session instead
# of detaching; zsh runs tmux with exec, so a detach closes the Alacritty window
set -g detach-on-destroy off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# <prefix> Space: pick any hash / URL / path / ARN on screen with fzf, enter copies it, tab types it
set -g @extrakto_key 'Space'
set -g @extrakto_popup_size '70%,50%'

# auto-save sessions every 15 min, restore on tmux start
set -g @continuum-restore 'on'
# panes that ran nvim start `nvim` again; persistence.nvim then reopens that folder's files
set -g @resurrect-processes 'lazygit'

# <prefix> r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Status bar (tokyonight storm, like nvim and Alacritty) ---
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-justify centre
set -g status-interval 15 # the clock only shows minutes; also refreshes the git info

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#1f2335,bg=#7aa2f7,bold] #S #[bg=#1f2335] "

# Right: repo:branch of the active pane, date, time, host
set -g status-right-length 100
set -g status-right "#[fg=#9ece6a]#(~/.config/tmux/scripts/git-repo.sh '#{pane_current_path}')#[fg=#565f89]| #[fg=#7aa2f7]%d-%m-%Y %H:%M #[fg=#565f89]| #[fg=#bb9af7]#h "

# Windows in the middle; the active one orange, windows with a bell/activity red
setw -g window-status-format " #I:#W "
setw -g window-status-style 'fg=#565f89'
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-style 'fg=#ff9e64,bold'

# copy mode / popups / messages in the same colours
setw -g mode-style 'bg=#364a82,fg=#c0caf5'
set -g message-style 'bg=#1f2335,fg=#7aa2f7'
set -g popup-border-style 'fg=#7aa2f7'

# Fresh machine: fetch TPM, load it, then install the plugins above and reload.
# install_plugins needs the plugin path that tpm sets, so it has to run after it.
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
if "test ! -d ~/.config/tmux/plugins/tmux-sensible" \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins && tmux source-file ~/.config/tmux/tmux.conf'"

